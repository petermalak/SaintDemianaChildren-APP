name: saint_demiana_children
description: A Flutter app for Saint Demiana Church data collection and management

publish_to: 'none'

version: 1.0.12+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dependency Injection
  get_it:


  dartz:

  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  flutter_colorpicker: ^1.0.3
  
  # Navigation
  go_router: ^12.1.3
  
  # Local Storage
  hive:
  hive_flutter:

  # Image handling
  image_picker: ^1.0.4
  flutter_cache_manager: ^3.3.1
  path_provider: ^2.1.1
  
  # Utils
  intl: ^0.19.0
  excel: ^4.0.3
  share_plus: ^7.2.1
  
  # HTTP Client
  http: ^1.1.0
  dio: ^5.3.2
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  
  # Location Services
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  
  # Phone and WhatsApp integration
  url_launcher: ^6.2.1
  
  # Biometric Authentication
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.0.0
  
  # OTA Updates
  shorebird_code_push: ^2.0.5
  package_info_plus: ^8.0.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - shorebird.yaml
  
  # App icon configuration
  # flutter_icons:
  #   android: "launcher_icon"
  #   ios: true
  #   image_path: "assets/images/logo.png"

# App icon configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo2.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#8B1538"
    theme_color: "#8B1538"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"